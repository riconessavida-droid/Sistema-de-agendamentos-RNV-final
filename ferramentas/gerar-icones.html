<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gerar ícones do app — RNV</title>
<style>
  body { font-family: system-ui, sans-serif; background:#F4F2EE; color:#15201E;
         margin:0; padding:32px; display:flex; flex-direction:column;
         align-items:center; gap:20px; }
  h1 { font-size:20px; margin:0; }
  p  { margin:0; color:#5a5a5a; font-size:14px; text-align:center; max-width:640px;
       line-height:1.6; }
  .previews { display:flex; gap:20px; align-items:flex-end; flex-wrap:wrap;
              justify-content:center; }
  figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:6px; }
  figcaption { font-size:12px; color:#777; }
  canvas { border-radius:18%; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  button { background:#F0B429; color:#fff; border:0; padding:14px 28px;
           border-radius:12px; font-size:16px; font-weight:800; cursor:pointer; }
  button:hover { background:#D89F1E; }
  code { background:#e8e6e1; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
  <h1>Ícones do aplicativo</h1>
  <p>
    São os três ícones que o celular usa quando o sistema é adicionado à tela de
    início. Clique no botão: os arquivos vão para a sua pasta de Downloads e
    depois é só mover os três para
    <code>Sistema-de-agendamentos-RNV-final\public\</code>
  </p>

  <div class="previews">
    <figure><canvas id="c180" width="180" height="180" style="width:90px;height:90px"></canvas><figcaption>icon-180.png (iPhone)</figcaption></figure>
    <figure><canvas id="c192" width="192" height="192" style="width:96px;height:96px"></canvas><figcaption>icon-192.png</figcaption></figure>
    <figure><canvas id="c512" width="512" height="512" style="width:128px;height:128px"></canvas><figcaption>icon-512.png</figcaption></figure>
  </div>

  <button id="baixar">Baixar os três ícones</button>

<script>
/* A mesma logo do favicon: fundo verde da marca e as três barras douradas
   em escada. Desenhada em proporção, para servir em qualquer tamanho. */
function desenhar(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const u = s / 100;              // uma unidade = 1% do lado

  ctx.fillStyle = '#0E4C45';
  ctx.fillRect(0, 0, s, s);

  ctx.fillStyle = '#F0B429';
  const barras = [
    { x: 26, y: 55, w: 11, h: 18 },
    { x: 44.5, y: 42, w: 11, h: 31 },
    { x: 63, y: 26, w: 11, h: 47 }
  ];
  const r = 3.5 * u;
  for (const b of barras) {
    const x = b.x * u, y = b.y * u, w = b.w * u, h = b.h * u;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }
}

const tamanhos = [180, 192, 512];
for (const t of tamanhos) desenhar(document.getElementById('c' + t));

document.getElementById('baixar').addEventListener('click', () => {
  for (const t of tamanhos) {
    document.getElementById('c' + t).toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'icon-' + t + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  }
});
</script>
</body>
</html>

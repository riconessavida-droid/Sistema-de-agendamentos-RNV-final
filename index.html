
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNV Consultoria Financeira</title>
    <!-- Favicon: a mesma logo em SVG, embutida (sem arquivo, sem requisição). -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230E4C45'/%3E%3Cg fill='%23F0B429'%3E%3Crect x='26' y='55' width='11' height='18' rx='3.5'/%3E%3Crect x='44.5' y='42' width='11' height='31' rx='3.5'/%3E%3Crect x='63' y='26' width='11' height='47' rx='3.5'/%3E%3C/g%3E%3C/svg%3E">
    <meta name="theme-color" content="#0E4C45">

    <!-- Instalável na tela de início. No iPhone é isto que transforma o
         sistema num ícone que abre em tela cheia e, principalmente, que
         permite receber notificação push sem App Store nem TestFlight. -->
    <!-- ".json" e não ".webmanifest" de propósito: o rewrite da SPA no
         vercel.json só deixa passar extensões de 2 a 5 letras, e
         "webmanifest" tem 11 — o arquivo virava index.html e o iPhone
         lia como manifesto inválido. -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RNV">
    <!-- O iOS ignora os ícones do manifesto e usa este. -->
    <link rel="apple-touch-icon" href="/icon-180.png">

    <!-- Preview do link no WhatsApp (Open Graph). É o cartão que o cliente
         vê antes de clicar — sem isto, o link chega "pelado". -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RNV Consultoria Financeira">
    <meta property="og:title" content="Agende sua reunião · RNV Consultoria">
    <meta property="og:description" content="Escolha o melhor horário e receba o link do Meet na hora.">
    <meta property="og:image" content="https://agenda.rnvconsultoria.com/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://agenda.rnvconsultoria.com">
    <meta property="og:locale" content="pt_BR">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="Escolha o melhor horário e receba o link do Meet na hora.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* O sistema interno segue com Inter. A tipografia da marca
           (Sora + IBM Plex) é aplicada nas páginas que o CLIENTE vê. */
        body { font-family: 'Inter', sans-serif; }

        .font-brand { font-family: 'Sora', sans-serif; }
        .font-body  { font-family: 'IBM Plex Sans', sans-serif; }
        .font-label { font-family: 'IBM Plex Mono', monospace; }

        /* O amarelo do Tailwind não é o da marca — este é. */
        .btn-brand { background-color: #F0B429; }
        .btn-brand:hover { background-color: #D89F1E; }
        .btn-brand:disabled:hover { background-color: #F0B429; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>

</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
